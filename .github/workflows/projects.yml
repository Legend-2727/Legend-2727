name: Generate Panels

# Builds every generated card -- the projects grid plus the streak, stats and
# language cards -- and publishes them to the `projects` branch, so the
# README's image URLs never have to change and nothing depends on a
# third-party card service staying up.
on:
  push:
    branches: [main]
    paths:
      - "projects.json"
      - "logos/**"
      - ".github/scripts/generate_projects.py"
      - ".github/scripts/generate_stats.py"
      - ".github/scripts/fetch_data.py"
      - ".github/workflows/projects.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Publishing rewrites a whole branch, so an older run finishing late would
# clobber a newer run's output. Keep one in flight and cancel the rest.
concurrency:
  group: panels
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch live repo data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/fetch_data.py

      - name: Render projects.svg
        run: |
          mkdir -p out
          python3 .github/scripts/generate_projects.py merged.json out

      - name: Render streak / stats / language cards
        env:
          # METRICS_TOKEN is optional: a PAT with read:user picks up private
          # contributions that the default Actions token cannot see.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/generate_stats.py "${{ github.repository_owner }}" out

      - name: Publish to projects branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: projects
          build_dir: out
          commit_message: "Update projects panel [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
